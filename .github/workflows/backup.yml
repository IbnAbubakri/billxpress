name: Database Backup
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pg_dump
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run pg_dump backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          pg_dump "${DATABASE_URL}" | gzip > "backups/billxpress_$(date -u +%Y%m%d_%H%M%S).sql.gz"
          echo "Backup created"
      - name: Prune old backups (keep last 14)
        run: |
          ls -t backups/billxpress_*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm
      - name: Commit and push backup
        run: |
          git config user.name "IbnAbubakri-BOT"
          git config user.email "faruqsuzay@gmail.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: automated backup $(date -u +%Y-%m-%d)"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
