name: Database Backup
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pg_dump backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          pg_dump "${DATABASE_URL}" | gzip > "backups/billxpress_$(date -u +%Y%m%d_%H%M%S).sql.gz"
          echo "Backup created"
      - name: Prune old backups (keep last 14)
        run: |
          ls -t backups/billxpress_*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm
      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: automated backup $(date -u +%Y-%m-%d)"
          git push
